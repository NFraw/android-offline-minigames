# 注意：file.encoding 用 GBK 而非 UTF-8，是因为 Gradle 以该编码写 test worker 的 @argfile，
# 而 JVM launcher 读 argfile 用系统 ANSI 编码（中文 Windows 即 GBK）。UTF-8 写入会导致
# 中文路径（项目位于 D:\03Project\安卓离线小游戏）乱码，单测类加载 ClassNotFoundException。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
# Kotlin daemon 默认用 JDK18+ 的 UTF-8，与 Gradle 侧 GBK 写出的 argfile 不匹配，
# 会导致中文源码路径被误读。这里显式统一为 GBK。
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=GBK
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.daemon=true
android.overridePathCheck=true
